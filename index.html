<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>るんるんジグソー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap');
:root{--ink:#563c66;--pink:#ff7ea8;--yellow:#ffd86c;--mint:#8fe0c5;--lav:#c9b2ff;--paper:#fffaf3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'M PLUS Rounded 1c','Kosugi Maru',sans-serif;background:radial-gradient(ellipse at 8% 12%,#fff 0 2px,transparent 3px),radial-gradient(ellipse at 88% 30%,#fff 0 2px,transparent 3px),linear-gradient(140deg,#fff0f5,#f1eaff 52%,#e4f9f1);background-size:38px 38px,53px 53px,auto;overflow-x:hidden}
header{text-align:center;padding:27px 16px 13px}.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:800;color:#bb82ac}.title{font-size:clamp(31px,6vw,54px);font-weight:900;margin:0;letter-spacing:.04em;text-shadow:3px 4px 0 white}.title span{display:inline-block;transform:rotate(-9deg);color:var(--pink);font-size:.8em;margin-right:7px}.subtitle{margin:2px 0 0;color:#9b82a5;font-weight:700;font-size:14px}
main{max-width:1060px;margin:auto;padding:8px 18px 36px}.panel{background:#ffffffd9;border:3px solid white;box-shadow:0 12px 32px #a986bb26;border-radius:25px;padding:17px 20px;margin-bottom:18px}.controls{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}.upload{display:inline-flex;align-items:center;gap:8px;background:#fff0f5;border:2px dashed #ffa5bf;color:#a65077;padding:11px 17px;border-radius:16px;font-weight:800;cursor:pointer;transition:.2s}.upload:hover{transform:translateY(-2px);background:#ffe5ee}input[type=file]{display:none}.label{font-size:13px;font-weight:800;color:#987ba5}.levels{display:flex;gap:5px;background:#f5effa;padding:5px;border-radius:14px}.level{border:0;background:transparent;color:#907a9c;font:inherit;font-size:13px;font-weight:800;padding:8px 11px;border-radius:10px;cursor:pointer}.level.active{background:white;color:#a45a92;box-shadow:0 2px 8px #70528420}.start{border:0;border-radius:15px;background:linear-gradient(135deg,#ff91b0,#ff6e9a);color:white;font:inherit;font-weight:900;font-size:16px;padding:12px 25px;box-shadow:0 5px 0 #df5e85;cursor:pointer;transition:.15s}.start:hover{transform:translateY(-2px);box-shadow:0 7px 0 #df5e85}.start:active{transform:translateY(3px);box-shadow:0 2px 0 #df5e85}.note{text-align:center;font-size:12px;color:#aa93ad;margin:11px 0 0}
.game{display:block}.board-wrap{background:#ffffffc9;border:3px solid white;border-radius:25px;padding:clamp(12px,2.5vw,24px);box-shadow:0 12px 32px #a986bb1c}.board-head{display:flex;align-items:center;justify-content:space-between;margin:0 3px 14px;font-weight:900}.board-actions{display:flex;align-items:center;gap:10px}.hint-btn{border:0;border-radius:13px;background:#e9e0fa;color:#80689d;padding:9px 14px;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #d3c2ed}.hint-btn:hover{background:#ded1f6}.badge{font-size:12px;color:#a778ab;background:#f6edff;padding:6px 11px;border-radius:20px}.board-stage{position:relative}.board{width:100%;aspect-ratio:1.55;margin:auto;background:#fff7fc;border:3px dashed #e5cde4;border-radius:15px;display:grid;gap:4px;padding:7px;touch-action:pan-y pinch-zoom;overflow:hidden}.cell{min-width:0;min-height:0;position:relative;border-radius:6px;overflow:hidden;background:#f3eaf3;cursor:pointer;transition:transform .12s,filter .12s}.cell:hover{filter:brightness(1.07)}.cell.selected{outline:4px solid #ffcc5e;z-index:1;transform:scale(.96)}.cell img{width:100%;height:100%;object-fit:fill;display:block;pointer-events:none}.cell.empty{background:repeating-linear-gradient(135deg,#fbf4fc,#fbf4fc 8px,#f5eafa 8px,#f5eafa 16px)}.board.hint{animation:wiggle .35s}.preview{position:absolute;inset:7px;z-index:5;display:none;align-items:center;justify-content:center;background:#fff8f2eF;border-radius:10px;padding:10px}.preview.show{display:flex;animation:pop .2s}.preview img{width:100%;height:100%;object-fit:contain;border-radius:8px;box-shadow:0 5px 24px #563c6640}.preview span{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#fff;color:#9b6491;padding:7px 16px;border-radius:18px;font-weight:900;box-shadow:0 2px 8px #563c6620}.status{text-align:center;min-height:42px;margin:15px 4px 0;font-weight:800;color:#ae719c;font-size:14px}.status strong{color:#ec6693}.result{text-align:center;display:none;padding:15px;background:linear-gradient(110deg,#fff2ae,#ffe1ed,#ede3ff);border:2px solid white;border-radius:17px;margin-top:10px;font-weight:900;font-size:clamp(23px,4vw,34px);color:#e76591;text-shadow:0 2px white;animation:pop .45s}.result.show{display:block;animation:pop .45s,glow 1.1s ease-in-out infinite alternate}.win-overlay{position:absolute;left:0;right:0;bottom:13px;z-index:8;display:none;align-items:center;justify-content:center;pointer-events:none}.win-overlay.show{display:flex;animation:fadein .2s}.win-card{background:#fffdf5f2;padding:12px 25px;border:2px solid #ffe5a0;border-radius:999px;text-align:center;box-shadow:0 5px 18px #563c6630;animation:winpop .35s cubic-bezier(.2,1.4,.4,1)}.win-card b{color:#e97894;font-size:clamp(26px,5vw,38px);line-height:1.1}.win-card span{margin-left:9px;font-size:clamp(13px,2.3vw,17px);font-weight:900;color:#806b91}.instructions{margin:13px 2px 0;padding:12px 16px;border-radius:15px;background:#f8f1ff;color:#90779d;text-align:center;font-size:13px;font-weight:800}.reset{display:block;margin:10px auto 0;border:0;background:#e9e0fa;color:#80689d;border-radius:12px;padding:9px 16px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.spark{position:absolute;animation:fall 1.8s ease-in forwards;font-size:22px}.foot{text-align:center;font-size:12px;color:#ad99b2;margin:16px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#654a70;color:white;padding:12px 20px;border-radius:14px;font-weight:800;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}@keyframes glow{to{box-shadow:0 0 23px #ffb6d5a6,0 0 42px #efd1ffa6}}@keyframes winpop{from{transform:scale(.25) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes wiggle{25%{transform:rotate(1deg)}75%{transform:rotate(-1deg)}}@keyframes fall{to{transform:translateY(90vh) rotate(500deg);opacity:0}}
@media(max-width:720px){header{padding:20px 12px 10px}.title{font-size:clamp(29px,9vw,42px)}main{padding:6px 10px 24px}.panel{padding:12px;border-radius:20px}.board-wrap{padding:10px;border-radius:20px}.board{aspect-ratio:1;padding:4px;gap:2px}.cell{border-radius:4px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload,.start{width:100%;min-height:48px;justify-content:center;padding:10px 8px;font-size:14px}.levels{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:4px;padding:4px}.level{padding:9px 3px;font-size:12px}.note{margin-top:8px}.board-head{margin-bottom:9px;font-size:14px}.board-actions{gap:6px}.hint-btn{min-height:42px;padding:7px 11px;font-size:13px}.badge{font-size:11px;padding:6px 8px}.instructions{font-size:12px;padding:10px}.win-card{padding:10px 18px}.win-card span{margin-left:5px}.preview{inset:4px}.preview span{font-size:12px;top:9px}.result{font-size:23px;padding:11px}}
</style><style>
@media(max-width:720px){.controls{display:flex;flex-direction:column;align-items:center;justify-content:center}.upload,.start{width:min(100%,280px);align-self:center}.levels{order:2;width:min(100%,420px);align-self:center}.start{order:3}}
</style></head>
<body><header><div class="eyebrow">✦ きみだけのパズルタイム ✦</div><h1 class="title"><span>✿</span>るんるんジグソー</h1><p class="subtitle">ピースをならべて、絵を完成させよう！</p></header>
<main><section class="panel"><div class="controls"><label class="upload">📷 すきな画像をえらぶ<input id="file" type="file" accept="image/*"></label><div class="levels" role="group" aria-label="難易度"><button class="level active" data-n="3">★ かんたん</button><button class="level" data-n="4">★★ ふつう</button><button class="level" data-n="5">★★★ むずかしい</button></div><button id="start" class="start">▶ スタート！</button></div><p class="note">画像をえらんで難易度を決めたら、スタートをおしてね ✨</p></section>
<section class="game"><div class="board-wrap"><div class="board-head"><span>🧩 パズルボード</span><div class="board-actions"><span class="badge" id="progress">準備中</span><button id="hint" class="hint-btn" type="button">👀 ヒント</button></div></div><div class="board-stage"><div id="board" class="board" aria-label="パズルボード"></div><div id="preview" class="preview" aria-hidden="true"><img id="previewImage" alt="パズルの元画像"><span>もとの絵はこれだよ！</span></div><div id="winOverlay" class="win-overlay" aria-hidden="true"><div class="win-card"><b>完成！</b><span>🎊 やったね！すごい！ 🎊</span></div></div></div><div class="status" id="status">まずは画像をえらんでね！</div><div id="result" class="result">🎉 完成！すごい！ 🎉</div><button id="again" class="reset" hidden>もういちどシャッフル</button><div class="instructions">💡 ボードのピースを2つタップすると、場所を入れかえられるよ！</div></div></section><p class="foot">✧ あせらず、たのしく、できあがり！ ✧</p></main><div id="sparks" class="sparkles"></div><div class="toast" id="toast"></div>
<script>
(()=>{const $=s=>document.querySelector(s),board=$('#board'),file=$('#file'),status=$('#status');let image=null,n=3,slots=[],selected=null,playing=false,completed=false,custom=false,hintTimer;
// Friendly built-in picture keeps the game playable before an upload.
function sample(){let c=document.createElement('canvas');c.width=900;c.height=650;let x=c.getContext('2d');let g=x.createLinearGradient(0,0,900,650);g.addColorStop(0,'#ffcee0');g.addColorStop(1,'#d9d4ff');x.fillStyle=g;x.fillRect(0,0,900,650);x.fillStyle='#fff7d8';x.beginPath();x.arc(715,130,76,0,7);x.fill();for(let i=0;i<14;i++){let xx=(i*173+35)%900, yy=500+(i%3)*35;x.fillStyle=['#a8e3bf','#8dd6b8','#b6e4b7'][i%3];x.beginPath();x.ellipse(xx,yy,130,80,0,Math.PI,Math.PI*2);x.fill()}x.font='190px sans-serif';x.textAlign='center';x.fillText('🐱',450,440);x.font='60px sans-serif';x.fillText('🌼',145,390);x.fillText('🌷',735,440);x.font='40px sans-serif';for(let i=0;i<12;i++)x.fillText('✦',(i*97+22)%900,(i*83+48)%380);return c.toDataURL()}
image=sample();function drawPreview(){build(false)}
document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{document.querySelector('.level.active').classList.remove('active');b.classList.add('active');n=+b.dataset.n;if(!playing)build(false)});
file.onchange=()=>{let f=file.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('画像ファイルをえらんでね');let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{image=u;custom=true;playing=false;completed=false;$('#result').classList.remove('show');$('#again').hidden=true;build(false);status.textContent='画像をセットしたよ！スタートをおしてね ✨';};im.onerror=()=>toast('この画像は読みこめなかったみたい');im.src=u};
function pieces(){let im=new Image();im.onload=()=>{let w=im.naturalWidth/n,h=im.naturalHeight/n;let cv=document.createElement('canvas');cv.width=w;cv.height=h;let ctx=cv.getContext('2d');let arr=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++){ctx.clearRect(0,0,w,h);ctx.drawImage(im,c*w,r*h,w,h,0,0,w,h);arr.push(cv.toDataURL())}init(arr)};im.src=image}
function build(preview){board.style.gridTemplateColumns=`repeat(${n},1fr)`;board.style.gridTemplateRows=`repeat(${n},1fr)`;board.innerHTML='';$('#progress').textContent=preview?'準備OK':`${n*n} ピース`;let count=n*n;for(let i=0;i<count;i++){let d=document.createElement('div');d.className='cell empty';d.dataset.i=i;board.append(d)}}
function addTile(cell,id,url){let im=document.createElement("img");im.src=url;cell.append(im)}
function init(src){let ids=src.map((_,i)=>i);for(let attempt=0;attempt<40;attempt++){for(let i=ids.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[ids[i],ids[j]]=[ids[j],ids[i]] }if(!ids.every((v,i)=>matches(v,i)))break;}if(ids.every((v,i)=>matches(v,i))){let other=ids.findIndex(v=>!matches(v,0));if(other>0)[ids[0],ids[other]]=[ids[other],ids[0]];}slots=ids;playing=true;completed=false;selected=null;$('#result').classList.remove('show');$('#winOverlay').classList.remove('show');$('#winOverlay').setAttribute('aria-hidden','true');$('#again').hidden=true;board.innerHTML='';board.classList.remove('hint','completed');board.style.gridTemplateColumns=`repeat(${n},1fr)`;board.style.gridTemplateRows=`repeat(${n},1fr)`;for(let i=0;i<slots.length;i++){let d=document.createElement('div');d.className='cell';d.dataset.i=i;if(slots[i]>=0)addTile(d,slots[i],src[slots[i]]);else d.classList.add('empty');d.onclick=()=>pickCell(i);board.append(d)}status.innerHTML='ボードのピースを2つえらんで入れかえよう！';check()}
function pickPiece(p){if(!playing||completed)return;document.querySelectorAll('.piece.selected').forEach(x=>x.classList.remove('selected'));p.classList.toggle('selected');selected=p.classList.contains('selected')?{type:'piece',el:p,id:+p.dataset.id}:null}
function pickCell(i){if(!playing||completed)return;let cell=board.children[i];if(!selected){if(slots[i]<0)return;cell.classList.add('selected');selected={type:'cell',i};return}if(selected.type==='cell'){let a=selected.i;if(a===i){cell.classList.remove('selected');selected=null;return}[slots[a],slots[i]]=[slots[i],slots[a]];selected=null;renderSlots();check();return}let from=selected.el;let pieceId=selected.id;if(slots[i]>=0){let current=slots[i];slots[i]=pieceId;from.dataset.id=current;from.querySelector('img').src=cell.querySelector('img').src}else{slots[i]=pieceId;from.remove()}selected=null;cell.classList.remove('selected');renderSlots();check()}
function renderSlots(){[...board.children].forEach((d,i)=>{d.classList.remove('selected','empty');d.innerHTML='';if(slots[i]<0)d.classList.add('empty');else addTile(d,slots[i],tileURL(slots[i]))})}
// Keep cropped source tiles available for re-rendering after swaps.
let tileURLs=[],equivalent=[];function tileURL(i){return tileURLs[i]||image}
function matches(a,b){return a===b||!!equivalent[a]?.[b]}
// Compare every pixel, composited on white. A small tolerance absorbs encoding noise.
function samePixels(a,b){if(a.length!==b.length)return false;let total=0;for(let i=0;i<a.length;i+=4){for(let c=0;c<3;c++){let x=255+(a[i+c]-255)*a[i+3]/255,y=255+(b[i+c]-255)*b[i+3]/255,d=Math.abs(x-y);if(d>4)return false;total+=d;}}return total/(a.length/4*3)<=1;}
function classifyTiles(pixels){equivalent=pixels.map((a,i)=>pixels.map((b,j)=>i===j||samePixels(a,b)));}
function start(){if(!image)return toast('画像をえらんでね！');let im=new Image();im.onload=()=>{let w=im.naturalWidth/n,h=im.naturalHeight/n,cv=document.createElement('canvas');cv.width=w;cv.height=h;let c=cv.getContext('2d');tileURLs=[];let pixels=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++){c.clearRect(0,0,w,h);c.drawImage(im,x*w,y*h,w,h,0,0,w,h);tileURLs.push(cv.toDataURL());pixels.push(c.getImageData(0,0,cv.width,cv.height).data)}classifyTiles(pixels);init(tileURLs)};im.src=image}
function check(){let good=slots.filter((v,i)=>matches(v,i)).length;$('#progress').textContent=`${good} / ${slots.length} あってる`;if(good===slots.length){completed=true;playing=false;board.classList.add('completed');status.textContent='';$('#result').classList.add('show');$('#again').hidden=false;$('#winOverlay').classList.add('show');$('#winOverlay').setAttribute('aria-hidden','false');setTimeout(()=>{$('#winOverlay').classList.remove('show');$('#winOverlay').setAttribute('aria-hidden','true')},2000);celebrate()}}
function celebrate(){let root=$('#sparks'),em=['✨','🌸','💖','⭐','🎉','🦋'];for(let i=0;i<34;i++){let s=document.createElement('span');s.className='spark';s.textContent=em[Math.random()*em.length|0];s.style.left=(Math.random()*100)+'vw';s.style.top=(-24-Math.random()*36)+'px';s.style.animationDelay=(Math.random()*.65)+'s';s.style.fontSize=(18+Math.random()*20)+'px';root.append(s);setTimeout(()=>s.remove(),2600)}}
function toast(t){let el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
$('#hint').onclick=()=>{if(!image)return toast('まずは画像をえらんでね！');let p=$('#preview');$('#previewImage').src=image;p.classList.add('show');p.setAttribute('aria-hidden','false');clearTimeout(hintTimer);hintTimer=setTimeout(()=>{p.classList.remove('show');p.setAttribute('aria-hidden','true')},2000)};$('#start').onclick=start;$('#again').onclick=start;drawPreview();
})();
</script></body></html>
